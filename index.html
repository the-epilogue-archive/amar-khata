<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আমার খাতা — কবিতা ও গল্প</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atma:wght@400;500;600&family=Caveat:wght@500;600;700&family=Hind+Siliguri:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh;
    font-family:'Hind Siliguri',system-ui,sans-serif;
    color:#2f2a24;
    background-color:#e8dcc0;
    background-image:
      radial-gradient(circle at 15% 8%, rgba(255,255,255,.55), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(255,255,255,.4), transparent 40%),
      repeating-linear-gradient(45deg, rgba(180,160,120,.06) 0 2px, transparent 2px 6px);
    padding:26px 16px 60px;
  }
  .gate{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:#e8dcc0; padding:20px;
  }
  .gate-card{
    background:#fdfaf1; padding:36px 34px; text-align:center;
    border-radius:6px 14px 8px 16px / 14px 6px 16px 8px;
    box-shadow:0 18px 40px rgba(90,70,40,.28);
    border:1px solid #e3d9c2; max-width:380px; width:100%;
    transform:rotate(-.6deg);
  }
  .gate-emoji{font-size:52px; line-height:1}
  .gate-card h2{
    font-family:'Caveat','Atma',cursive; font-size:40px;
    margin:6px 0 4px; color:#3b3227;
  }
  .gate-card p{margin:0 0 20px; color:#6b6152; font-size:15px}
  .gate-note{font-size:13px; color:#a8563f; min-height:18px; margin-top:14px !important}

  .topbar{
    max-width:1180px; margin:0 auto 16px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:0 6px;
  }
  .brand{display:flex; align-items:center; gap:10px}
  .brand .doodle{font-size:26px; transform:rotate(-12deg)}
  .brand h1{
    font-family:'Caveat','Atma',cursive; font-weight:700;
    font-size:34px; margin:0; color:#3b3227; letter-spacing:.5px;
  }
  .top-actions{display:flex; gap:10px}

  button{
    font-family:'Hind Siliguri',sans-serif; font-size:15px;
    border:1.5px solid #b8ab8e; background:#fffdf6; color:#3b3227;
    padding:8px 16px; cursor:pointer; transition:.15s;
    border-radius:9px 3px 10px 4px / 4px 10px 3px 9px;
    box-shadow:1px 2px 0 rgba(120,100,60,.22);
  }
  button:hover{background:#fff6dc; transform:translateY(-1px)}
  button:active{transform:translateY(1px); box-shadow:none}
  button:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:1px 2px 0 rgba(120,100,60,.15)}
  button.primary{background:#2f6f4e; color:#fffdf6; border-color:#245a3e}
  button.primary:hover{background:#377f5a}
  button.big{font-size:17px; padding:11px 30px}
  button.danger{border-color:#d8a79c; color:#a8563f}

  .notebook{
    max-width:1180px; margin:0 auto; position:relative;
    display:grid; grid-template-columns:290px 1fr;
    background:#fdfaf1; border-radius:5px 10px 8px 12px / 10px 5px 12px 8px;
    box-shadow:0 20px 44px rgba(90,70,40,.26), 0 2px 0 #d9cdb2;
    overflow:hidden;
  }
  .notebook::before{
    content:''; position:absolute; left:7px; top:22px; bottom:22px; width:22px;
    background-image:radial-gradient(circle at center, transparent 0 4px, #c3b89f 4px 6.5px, transparent 7px);
    background-size:22px 27px; background-repeat:repeat-y;
    pointer-events:none; z-index:6; opacity:.85;
  }

  .sidebar{
    background:linear-gradient(180deg,#f8f3e6,#f1ead9);
    border-right:1px dashed #d8cdb4;
    padding:20px 14px 20px 42px;
    max-height:78vh; overflow-y:auto;
  }
  .sidebar::-webkit-scrollbar{width:7px}
  .sidebar::-webkit-scrollbar-thumb{background:#d3c7aa; border-radius:4px}
  .side-label{
    font-family:'Caveat','Atma',cursive; font-size:22px;
    color:#7a6f5c; margin:0 0 8px 2px;
  }
  #search{
    width:100%; padding:8px 11px; margin-bottom:14px;
    border:1.5px solid #ddd0b4; background:#fffdf6; font-family:inherit;
    font-size:14px; border-radius:8px 3px 9px 4px / 4px 9px 3px 8px;
    outline:none; color:#3b3227;
  }
  #search:focus{border-color:#b8ab8e; background:#fff}

  .card{
    background:#fffdf6; border:1px solid #e3d9c2; border-left:4px solid #c9a24a;
    border-radius:3px; padding:9px 11px; margin-bottom:10px; cursor:pointer;
    box-shadow:0 2px 5px rgba(120,100,60,.09);
    transition:transform .16s, box-shadow .16s;
  }
  .card:nth-child(odd){transform:rotate(-.55deg)}
  .card:nth-child(even){transform:rotate(.55deg)}
  .card:hover{transform:rotate(0) translateY(-2px); box-shadow:0 7px 15px rgba(120,100,60,.2)}
  .card.active{background:#fff8e1; border-left-color:#2f6f4e}
  .card-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:3px}
  .badge{
    font-size:11px; padding:1px 8px; border-radius:20px;
    background:#e3edff; color:#3d5a91; border:1px solid #c5d8f5;
  }
  .badge.story{background:#e6f5e9; color:#3b7048; border-color:#c3e5cc}
  .card-date{font-size:11px; color:#9d9382}
  .card-title{
    font-family:'Caveat','Atma',cursive; font-size:21px; line-height:1.15;
    color:#332c22; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .card-prev{
    font-size:12.5px; color:#8b8172; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; margin-top:1px;
  }
  .empty{font-size:13.5px; color:#a19785; text-align:center; padding:18px 6px; line-height:1.7}

  .page{
    position:relative; display:flex; flex-direction:column;
    min-height:78vh; padding:30px 40px 18px 64px;
    background-color:#fdfaf1;
  }
  .page::before{
    content:''; position:absolute; left:44px; top:0; bottom:0; width:2px;
    background:#e8a9a9; opacity:.5;
  }
  .tape{
    position:absolute; top:12px; right:38px; width:98px; height:26px;
    background:rgba(255,226,138,.72); transform:rotate(4deg);
    box-shadow:0 1px 3px rgba(0,0,0,.09);
    border-left:1px dashed rgba(255,255,255,.6);
    border-right:1px dashed rgba(255,255,255,.6);
    pointer-events:none;
  }

  .page-head{margin-bottom:14px; position:relative; z-index:2}
  #title{
    width:100%; border:0; outline:0; background:transparent;
    font-family:'Caveat','Atma',cursive; font-size:38px; font-weight:700;
    color:#2f2a24; padding:0 0 4px; line-height:1.2;
  }
  #title::placeholder{color:#c9c0ad}
  .page-meta{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap; margin-top:6px;
    border-bottom:1px dashed #ddd0b4; padding-bottom:10px;
  }
  #dateLabel{font-size:13px; color:#9d9382}
  .type-toggle{display:flex; gap:0}
  .type-toggle button{
    font-size:13.5px; padding:4px 15px; box-shadow:none;
    border-radius:0; border-right-width:0;
  }
  .type-toggle button:first-child{border-radius:8px 0 0 8px}
  .type-toggle button:last-child{border-radius:0 8px 8px 0; border-right-width:1.5px}
  .type-toggle button.active{background:#2f6f4e; color:#fffdf6; border-color:#245a3e}

  .paper-lines{
    flex:1; position:relative; min-height:44vh;
    background-image:repeating-linear-gradient(180deg, transparent 0 33px, #d9e2ea 33px 34px);
  }
  #body{
    width:100%; height:100%; min-height:44vh;
    border:0; outline:0; background:transparent; resize:none;
    font-family:'Hind Siliguri',sans-serif; font-size:17px;
    line-height:34px; color:#2f2a24; padding:0; display:block;
  }
  #body::placeholder{color:#c9c0ad}

  .page-foot{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    border-top:1px dashed #ddd0b4; padding-top:12px; margin-top:6px;
  }
  #status{font-size:13px; color:#8b8172; flex:1; min-width:120px}
  #count{font-size:12.5px; color:#a89e8b}

  @media (max-width:880px){
    body{padding:16px 10px 40px}
    .brand h1{font-size:27px}
    .notebook{grid-template-columns:1fr}
    .sidebar{
      max-height:33vh; border-right:0;
      border-bottom:1px dashed #d8cdb4;
      padding:16px 14px 16px 38px;
    }
    .page{padding:22px 20px 16px 46px; min-height:60vh}
    .page::before{left:30px}
    #title{font-size:30px}
    #body{font-size:16px}
    .tape{right:16px; width:76px}
  }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-emoji">📓</div>
    <h2>আমার খাতা</h2>
    <p>কবিতা আর গল্পের নিজের খাতা — শুধু তোমার।</p>
    <button class="primary big" id="startBtn">খাতা খোলো</button>
    <p class="gate-note" id="gateNote"></p>
  </div>
</div>

<div id="app" style="display:none">
  <header class="topbar">
    <div class="brand">
      <span class="doodle">✎</span>
      <h1>আমার খাতা</h1>
    </div>
    <div class="top-actions">
      <button id="newBtn">+ নতুন পাতা</button>
      <button id="logoutBtn" class="danger">লগআউট</button>
    </div>
  </header>

  <main class="notebook">
    <aside class="sidebar">
      <p class="side-label">আমার পাতা</p>
      <input id="search" type="text" placeholder="খুঁজো...">
      <div id="list"></div>
    </aside>

    <section class="page">
      <div class="tape"></div>

      <div class="page-head">
        <input id="title" type="text" placeholder="শিরোনাম...">
        <div class="page-meta">
          <span id="dateLabel"></span>
          <div class="type-toggle">
            <button data-type="কবিতা" class="active">কবিতা</button>
            <button data-type="গল্প">গল্প</button>
          </div>
        </div>
      </div>

      <div class="paper-lines">
        <textarea id="body" placeholder="এখানে লেখা শুরু করো..."></textarea>
      </div>

      <div class="page-foot">
        <span id="status">—</span>
        <span id="count"></span>
        <button id="deleteBtn" class="danger" disabled>মুছে ফেলো</button>
        <button id="saveBtn" class="primary">সংরক্ষণ</button>
      </div>
    </section>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc,
  onSnapshot, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============================================================
   তোমার Firebase config
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyAmTciv-fMB1ECq0-mjR_vpADOGN4Ricqo",
  authDomain: "amar-khata-4cb59.firebaseapp.com",
  projectId: "amar-khata-4cb59",
  storageBucket: "amar-khata-4cb59.firebasestorage.app",
  messagingSenderId: "274613622270",
  appId: "1:274613622270:web:ddaec4f1429250deb21caf",
  measurementId: "G-RD8GHG111E"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const $ = s => document.querySelector(s);

let uid = null;
let entries = [];
let currentId = null;
let currentType = 'কবিতা';
let unsub = null;
let saveTimer = null;
let isDirty = false;

const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmtDate = ts => {
  if (!ts) return '';
  try {
    return new Date(ts).toLocaleDateString('bn-BD',
      { day:'numeric', month:'long', year:'numeric' });
  } catch { return new Date(ts).toLocaleDateString(); }
};

/* ---------- Auth ---------- */
$('#startBtn').addEventListener('click', async () => {
  $('#gateNote').textContent = 'খোলা হচ্ছে...';
  try {
    await signInAnonymously(auth);
  } catch (e) {
    $('#gateNote').textContent =
      'সমস্যা: ' + e.message + ' — Authentication → Anonymous চালু আছে কি?';
  }
});

$('#logoutBtn').addEventListener('click', async () => {
  if (!confirm('লগআউট করলে এই ব্রাউজার থেকে খাতা বিচ্ছিন্ন হয়ে যাবে। ঠিক আছে?')) return;
  if (unsub) { unsub(); unsub = null; }
  await signOut(auth);
  location.reload();
});

onAuthStateChanged(auth, user => {
  if (user) {
    uid = user.uid;
    $('#gate').style.display = 'none';
    $('#app').style.display  = 'block';
    subscribe();
    newEntry();
  } else {
    $('#gate').style.display = 'flex';
    $('#app').style.display  = 'none';
    $('#startBtn').disabled  = false;
    $('#gateNote').textContent = '';
  }
});

/* ---------- Firestore subscribe ---------- */
function subscribe() {
  if (unsub) unsub();
  const q = query(
    collection(db, 'users', uid, 'entries'),
    orderBy('updatedAt', 'desc')
  );
  unsub = onSnapshot(q, snap => {
    entries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderList();
  }, err => {
    console.error(err);
    setStatus('লোড হয়নি: ' + err.message);
  });
}

/* ---------- List render ---------- */
function renderList() {
  const term = ($('#search').value || '').trim().toLowerCase();
  const list = entries.filter(e =>
    !term ||
    (e.title || '').toLowerCase().includes(term) ||
    (e.body  || '').toLowerCase().includes(term)
  );

  const box = $('#list');
  if (!list.length) {
    box.innerHTML = `<p class="empty">${term ? 'কিছু পাওয়া গেল না।' : 'এখনো কোনো পাতা নেই।<br>লেখা শুরু করো ✎'}</p>`;
    return;
  }

  box.innerHTML = list.map(e => `
    <div class="card ${e.id === currentId ? 'active' : ''}" data-id="${e.id}">
      <div class="card-top">
        <span class="badge ${e.type === 'গল্প' ? 'story' : ''}">${esc(e.type || 'কবিতা')}</span>
        <span class="card-date">${fmtDate(e.updatedAt || e.createdAt)}</span>
      </div>
      <div class="card-title">${esc(e.title || 'শিরোনামহীন')}</div>
      <div class="card-prev">${esc((e.body || '').replace(/\s+/g, ' ').slice(0, 55)) || '...'}</div>
    </div>`).join('');
}

$('#list').addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (card) openEntry(card.dataset.id);
});

$('#search').addEventListener('input', renderList);

/* ---------- Entry open / new / save / delete ---------- */
async function openEntry(id) {
  if (id === currentId) return;
  if (isDirty) await save();
  const e = entries.find(x => x.id === id);
  if (!e) return;

  currentId   = id;
  currentType = e.type || 'কবিতা';
  $('#title').value = e.title || '';
  $('#body').value  = e.body  || '';
  $('#dateLabel').textContent = fmtDate(e.createdAt);
  $('#deleteBtn').disabled = false;
  isDirty = false;

  setTypeUI();
  updateCount();
  renderList();
  setStatus('সংরক্ষিত ✓');
}

function newEntry() {
  currentId = null;
  currentType = 'কবিতা';
  $('#title').value = '';
  $('#body').value  = '';
  $('#dateLabel').textContent = fmtDate(Date.now());
  $('#deleteBtn').disabled = true;
  isDirty = false;

  setTypeUI();
  updateCount();
  renderList();
  setStatus('নতুন পাতা');
  $('#title').focus();
}

async function save() {
  const title = $('#title').value.trim();
  const body  = $('#body').value;
  if (!title && !body.trim()) return;

  setStatus('সংরক্ষণ হচ্ছে...');
  try {
    const now = Date.now();
    if (currentId) {
      await updateDoc(doc(db, 'users', uid, 'entries', currentId),
        { title, body, type: currentType, updatedAt: now });
    } else {
      const ref = await addDoc(collection(db, 'users', uid, 'entries'),
        { title, body, type: currentType, createdAt: now, updatedAt: now });
      currentId = ref.id;
      $('#deleteBtn').disabled = false;
      renderList();
    }
    isDirty = false;
    setStatus('সংরক্ষিত ✓');
  } catch (err) {
    console.error(err);
    setStatus('সমস্যা: ' + err.message);
  }
}

function queueSave() {
  isDirty = true;
  setStatus('অসংরক্ষিত...');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 1400);
}

$('#saveBtn').addEventListener('click', () => { clearTimeout(saveTimer); save(); });
$('#newBtn').addEventListener('click', async () => {
  if (isDirty) await save();
  newEntry();
});

$('#deleteBtn').addEventListener('click', async () => {
  if (!currentId) return;
  if (!confirm('এই পাতাটি মুছে ফেলা হবে। নিশ্চিত?')) return;
  try {
    await deleteDoc(doc(db, 'users', uid, 'entries', currentId));
    newEntry();
    setStatus('মুছে ফেলা হয়েছে');
  } catch (err) {
    setStatus('মুছতে পারিনি: ' + err.message);
  }
});

/* ---------- Inputs ---------- */
$('#title').addEventListener('input', queueSave);
$('#body').addEventListener('input', () => { queueSave(); updateCount(); });

document.querySelectorAll('.type-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    currentType = btn.dataset.type;
    setTypeUI();
    if ($('#title').value || $('#body').value.trim()) queueSave();
  });
});

function setTypeUI() {
  document.querySelectorAll('.type-toggle button').forEach(b =>
    b.classList.toggle('active', b.dataset.type === currentType));
}

function setStatus(txt) { $('#status').textContent = txt; }

function updateCount() {
  const t = $('#body').value;
  const words = t.trim() ? t.trim().split(/\s+/).length : 0;
  $('#count').textContent = `${words} শব্দ · ${t.length} অক্ষর`;
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    clearTimeout(saveTimer);
    save();
  }
});
</script>
</body>
</html>
