<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আমার খাতা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh;
    font-family:'Hind Siliguri',system-ui,sans-serif;
    color:#2f2a24;
    background-color:#e8dcc0;
    background-image:
      radial-gradient(circle at 15% 8%, rgba(255,255,255,.55), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(255,255,255,.4), transparent 40%);
    padding:26px 16px 60px;
  }
  button{
    font-family:'Hind Siliguri',sans-serif; font-size:15px;
    border:1.5px solid #b8ab8e; background:#fffdf6; color:#3b3227;
    padding:8px 16px; cursor:pointer; transition:.15s;
    border-radius:9px 3px 10px 4px / 4px 10px 3px 9px;
    box-shadow:1px 2px 0 rgba(120,100,60,.22);
  }
  button:hover{background:#fff6dc; transform:translateY(-1px)}
  button:active{transform:translateY(1px); box-shadow:none}
  button:disabled{opacity:.4; cursor:not-allowed; transform:none}
  button.primary{background:#2f6f4e; color:#fffdf6; border-color:#245a3e}
  button.primary:hover{background:#377f5a}
  button.big{font-size:17px; padding:11px 30px; width:100%}
  button.danger{border-color:#d8a79c; color:#a8563f}
  button.admin{background:#5b3d8a; color:#fffdf6; border-color:#3f2a63}
  button.admin:hover{background:#6c4aa3}
  button.ghost{background:transparent; border-color:#c9bda1; color:#6b6152}

  .auth-wrap{
    position:fixed; inset:0; z-index:60;
    display:flex; align-items:center; justify-content:center;
    background:#e8dcc0; padding:20px;
  }
  .auth-card{
    background:#fdfaf1; padding:30px 30px 26px;
    border-radius:6px 16px 8px 18px / 16px 6px 18px 8px;
    box-shadow:0 22px 50px rgba(90,70,40,.32);
    border:1px solid #e3d9c2; max-width:420px; width:100%;
    position:relative;
  }
  .auth-card::before{
    content:''; position:absolute; top:-8px; left:50%; transform:translateX(-50%) rotate(-3deg);
    width:110px; height:22px; background:rgba(255,226,138,.75);
    box-shadow:0 1px 3px rgba(0,0,0,.1);
  }
  .auth-emoji{font-size:46px; text-align:center; line-height:1; margin-bottom:4px}
  .auth-card h2{
    font-family:'Caveat',cursive; font-size:42px; text-align:center;
    margin:0 0 4px; color:#3b3227;
  }
  .auth-sub{text-align:center; color:#7a6f5c; font-size:14px; margin:0 0 20px}
  .auth-tabs{
    display:flex; margin-bottom:18px;
    border-bottom:2px solid #e3d9c2;
  }
  .auth-tabs button{
    flex:1; border:0; box-shadow:none; background:transparent;
    padding:10px 6px; font-size:15px; border-radius:0; color:#8b8172;
    border-bottom:3px solid transparent; margin-bottom:-2px;
  }
  .auth-tabs button.active{
    color:#2f6f4e; border-bottom-color:#2f6f4e; font-weight:600;
  }
  .field{margin-bottom:12px}
  .field label{
    display:block; font-size:13px; color:#7a6f5c;
    margin-bottom:4px; font-weight:500;
  }
  .field input{
    width:100%; padding:10px 13px;
    border:1.5px solid #ddd0b4; background:#fffdf6;
    font-family:inherit; font-size:15px; color:#2f2a24;
    border-radius:9px 3px 10px 4px / 4px 10px 3px 9px;
    outline:none;
  }
  .field input:focus{border-color:#2f6f4e; background:#fff}
  .google-btn{
    width:100%; padding:11px; font-size:15px;
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:#fff; border-color:#dadce0;
  }
  .google-btn:hover{background:#f8f9fa}
  .google-btn svg{width:20px; height:20px}
  .divider{
    display:flex; align-items:center; gap:10px;
    margin:16px 0; color:#a89e8b; font-size:13px;
  }
  .divider::before,.divider::after{
    content:''; flex:1; height:1px; background:#e3d9c2;
  }
  .auth-msg{
    font-size:13.5px; text-align:center; margin-top:12px;
    min-height:18px; color:#a8563f; line-height:1.5;
  }
  .auth-msg.ok{color:#2f6f4e}

  .topbar{
    max-width:1180px; margin:0 auto 16px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:0 6px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px}
  .brand h1{
    font-family:'Caveat',cursive; font-weight:700;
    font-size:34px; margin:0; color:#3b3227;
  }
  .brand small{display:block; font-size:12px; color:#7a6f5c; font-weight:400}
  .top-actions{display:flex; gap:8px; flex-wrap:wrap}

  .notebook{
    max-width:1180px; margin:0 auto; position:relative;
    display:grid; grid-template-columns:290px 1fr;
    background:#fdfaf1; border-radius:5px 10px 8px 12px / 10px 5px 12px 8px;
    box-shadow:0 20px 44px rgba(90,70,40,.26), 0 2px 0 #d9cdb2;
    overflow:hidden;
  }
  .sidebar{
    background:linear-gradient(180deg,#f8f3e6,#f1ead9);
    border-right:1px dashed #d8cdb4;
    padding:20px 14px 20px 34px;
    max-height:78vh; overflow-y:auto;
  }
  .side-label{
    font-family:'Caveat',cursive; font-size:22px;
    color:#7a6f5c; margin:0 0 8px 2px;
  }
  #search{
    width:100%; padding:8px 11px; margin-bottom:14px;
    border:1.5px solid #ddd0b4; background:#fffdf6; font-family:inherit;
    font-size:14px; border-radius:8px 3px 9px 4px / 4px 9px 3px 8px;
    outline:none;
  }
  #search:focus{border-color:#b8ab8e; background:#fff}
  .card{
    background:#fffdf6; border:1px solid #e3d9c2; border-left:4px solid #c9a24a;
    border-radius:3px; padding:9px 11px; margin-bottom:10px; cursor:pointer;
    box-shadow:0 2px 5px rgba(120,100,60,.09);
  }
  .card:hover{box-shadow:0 7px 15px rgba(120,100,60,.2)}
  .card.active{background:#fff8e1; border-left-color:#2f6f4e}
  .card-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:3px}
  .badge{
    font-size:11px; padding:1px 8px; border-radius:20px;
    background:#e3edff; color:#3d5a91; border:1px solid #c5d8f5;
  }
  .badge.story{background:#e6f5e9; color:#3b7048; border-color:#c3e5cc}
  .card-date{font-size:11px; color:#9d9382}
  .card-title{
    font-family:'Caveat',cursive; font-size:21px; line-height:1.15;
    color:#332c22; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .card-prev{
    font-size:12.5px; color:#8b8172; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; margin-top:1px;
  }
  .empty{font-size:13.5px; color:#a19785; text-align:center; padding:18px 6px; line-height:1.7}

  .page{
    position:relative; display:flex; flex-direction:column;
    min-height:78vh; padding:30px 40px 18px 64px;
  }
  .page::before{
    content:''; position:absolute; left:44px; top:0; bottom:0; width:2px;
    background:#e8a9a9; opacity:.5;
  }
  .tape{
    position:absolute; top:12px; right:38px; width:98px; height:26px;
    background:rgba(255,226,138,.72);
    box-shadow:0 1px 3px rgba(0,0,0,.09);
    pointer-events:none;
  }
  #title{
    width:100%; border:0; outline:0; background:transparent;
    font-family:'Caveat',cursive; font-size:38px; font-weight:700;
    color:#2f2a24; padding:0 0 4px;
  }
  #title::placeholder{color:#c9c0ad}
  .page-meta{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap; margin-top:6px;
    border-bottom:1px dashed #ddd0b4; padding-bottom:10px;
  }
  #dateLabel{font-size:13px; color:#9d9382}
  .type-toggle{display:flex; gap:0}
  .type-toggle button{
    font-size:13.5px; padding:4px 15px; box-shadow:none;
    border-radius:0; border-right-width:0;
  }
  .type-toggle button:first-child{border-radius:8px 0 0 8px}
  .type-toggle button:last-child{border-radius:0 8px 8px 0; border-right-width:1.5px}
  .type-toggle button.active{background:#2f6f4e; color:#fffdf6; border-color:#245a3e}
  .paper-lines{
    flex:1; position:relative; min-height:44vh;
    background-image:repeating-linear-gradient(180deg, transparent 0 33px, #d9e2ea 33px 34px);
  }
  #body{
    width:100%; height:100%; min-height:44vh;
    border:0; outline:0; background:transparent; resize:none;
    font-family:'Hind Siliguri',sans-serif; font-size:17px;
    line-height:34px; color:#2f2a24; padding:0; display:block;
  }
  #body::placeholder{color:#c9c0ad}
  .page-foot{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    border-top:1px dashed #ddd0b4; padding-top:12px; margin-top:6px;
  }
  #status{font-size:13px; color:#8b8172; flex:1; min-width:120px}
  #count{font-size:12.5px; color:#a89e8b}

  .admin-wrap{
    max-width:1180px; margin:0 auto;
    background:#fdfaf1; border-radius:6px 14px 8px 16px / 14px 6px 16px 8px;
    box-shadow:0 22px 50px rgba(90,70,40,.28), 0 2px 0 #d9cdb2;
    padding:26px 30px 30px;
    min-height:78vh;
  }
  .admin-header{
    display:flex; align-items:center; justify-content:space-between;
    gap:14px; flex-wrap:wrap;
    border-bottom:2px dashed #ddd0b4; padding-bottom:16px; margin-bottom:20px;
  }
  .admin-header h2{
    font-family:'Caveat',cursive; font-size:36px;
    margin:0; color:#3b3227;
  }
  .stats-row{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
    gap:14px; margin-bottom:24px;
  }
  .stat{
    background:#fffdf6; border:1px solid #e3d9c2; border-left:5px solid #c9a24a;
    border-radius:4px; padding:14px 16px;
  }
  .stat:nth-child(1){border-left-color:#5b3d8a}
  .stat:nth-child(2){border-left-color:#2f6f4e}
  .stat:nth-child(3){border-left-color:#c9a24a}
  .stat:nth-child(4){border-left-color:#b8603f}
  .stat-label{font-size:12.5px; color:#7a6f5c; margin-bottom:4px}
  .stat-value{
    font-family:'Caveat',cursive; font-size:34px;
    color:#2f2a24; line-height:1; font-weight:700;
  }
  .admin-search{
    width:100%; padding:9px 13px; margin-bottom:16px;
    border:1.5px solid #ddd0b4; background:#fffdf6; font-family:inherit;
    font-size:14px; border-radius:8px 3px 9px 4px / 4px 9px 3px 8px;
    outline:none;
  }
  .admin-search:focus{border-color:#5b3d8a; background:#fff}
  .user-list{display:flex; flex-direction:column; gap:10px}
  .user-row{
    background:#fffdf6; border:1px solid #e3d9c2; border-left:4px solid #5b3d8a;
    border-radius:4px; padding:12px 16px;
    display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center;
  }
  .user-row.disabled{opacity:.55; border-left-color:#a8563f}
  .user-info{min-width:0}
  .user-email{
    font-weight:600; color:#2f2a24; font-size:15px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .user-meta{
    font-size:12.5px; color:#8b8172; margin-top:3px;
    display:flex; gap:14px; flex-wrap:wrap;
  }
  .user-meta b{color:#5b3d8a; font-weight:600}
  .user-actions{display:flex; gap:6px; flex-wrap:wrap}
  .user-actions button{font-size:13px; padding:5px 11px}
  .entries-panel{
    background:#f8f3e6; border:1px dashed #d8cdb4; border-radius:6px;
    padding:14px 16px; margin-top:12px; margin-bottom:8px;
  }
  .entries-panel h4{
    font-family:'Caveat',cursive; font-size:22px;
    margin:0 0 10px; color:#5b3d8a;
  }
  .entry-mini{
    background:#fffdf6; border:1px solid #e3d9c2; border-left:3px solid #c9a24a;
    border-radius:3px; padding:9px 12px; margin-bottom:7px;
    display:flex; justify-content:space-between; gap:10px; align-items:center;
  }
  .entry-mini-info{min-width:0; flex:1}
  .entry-mini-title{
    font-family:'Caveat',cursive; font-size:19px;
    color:#332c22; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .entry-mini-meta{font-size:11.5px; color:#8b8172; margin-top:2px}
  .entry-mini button{font-size:12px; padding:3px 9px}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(60,45,25,.5); z-index:100;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.show{display:flex}
  .modal{
    background:#fdfaf1; max-width:560px; width:100%; max-height:85vh;
    overflow-y:auto; padding:26px 28px;
    border-radius:6px 16px 8px 18px / 16px 6px 18px 8px;
    box-shadow:0 25px 60px rgba(60,40,20,.4);
    border:1px solid #e3d9c2;
  }
  .modal h3{
    font-family:'Caveat',cursive; font-size:30px;
    margin:0 0 12px; color:#3b3227;
  }
  .modal-body{font-size:15px; line-height:1.7; color:#2f2a24; white-space:pre-wrap}
  .modal-actions{margin-top:18px; display:flex; gap:8px; justify-content:flex-end}

  @media (max-width:880px){
    body{padding:16px 10px 40px}
    .brand h1{font-size:27px}
    .notebook{grid-template-columns:1fr}
    .sidebar{
      max-height:33vh; border-right:0;
      border-bottom:1px dashed #d8cdb4;
      padding:16px 14px 16px 30px;
    }
    .page{padding:22px 20px 16px 46px; min-height:60vh}
    .page::before{left:30px}
    #title{font-size:30px}
    #body{font-size:16px}
    .tape{right:16px; width:76px}
    .admin-wrap{padding:20px 16px}
    .admin-header h2{font-size:28px}
    .user-row{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div class="auth-wrap" id="authScreen">
  <div class="auth-card">
    <div class="auth-emoji">&#128211;</div>
    <h2>আমার খাতা</h2>
    <p class="auth-sub">কবিতা আর গল্পের নিজের খাতা</p>

    <div class="auth-tabs">
      <button id="tabLogin" class="active">লগইন</button>
      <button id="tabSignup">নতুন অ্যাকাউন্ট</button>
    </div>

    <button class="google-btn" id="googleBtn">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 18.9 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.2-7.9l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.5l6.2 5.2C41 35.2 44 30.1 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
      Google দিয়ে চালিয়ে যাও
    </button>

    <div class="divider">অথবা</div>

    <div class="field">
      <label>ইমেইল</label>
      <input id="email" type="email" placeholder="tumi@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label>পাসওয়ার্ড</label>
      <input id="password" type="password" placeholder="কমপক্ষে ৬ অক্ষর" autocomplete="current-password">
    </div>
    <div class="field" id="confirmWrap" style="display:none">
      <label>পাসওয়ার্ড আবার লেখো</label>
      <input id="password2" type="password" placeholder="একই পাসওয়ার্ড" autocomplete="new-password">
    </div>

    <button class="primary big" id="submitBtn">লগইন করো</button>
    <p class="auth-msg" id="authMsg"></p>
  </div>
</div>

<div id="appView" style="display:none">
  <header class="topbar">
    <div class="brand">
      <div>
        <h1>আমার খাতা</h1>
        <small id="userLabel"></small>
      </div>
    </div>
    <div class="top-actions">
      <button id="adminBtn" class="admin" style="display:none">অ্যাডমিন</button>
      <button id="newBtn">+ নতুন পাতা</button>
      <button id="logoutBtn" class="danger">লগআউট</button>
    </div>
  </header>

  <main class="notebook">
    <aside class="sidebar">
      <p class="side-label">আমার পাতা</p>
      <input id="search" type="text" placeholder="খুঁজো...">
      <div id="list"></div>
    </aside>

    <section class="page">
      <div class="tape"></div>
      <div class="page-head">
        <input id="title" type="text" placeholder="শিরোনাম...">
        <div class="page-meta">
          <span id="dateLabel"></span>
          <div class="type-toggle">
            <button data-type="কবিতা" class="active">কবিতা</button>
            <button data-type="গল্প">গল্প</button>
          </div>
        </div>
      </div>
      <div class="paper-lines">
        <textarea id="body" placeholder="এখানে লেখা শুরু করো..."></textarea>
      </div>
      <div class="page-foot">
        <span id="status">-</span>
        <span id="count"></span>
        <button id="deleteBtn" class="danger" disabled>মুছে ফেলো</button>
        <button id="saveBtn" class="primary">সংরক্ষণ</button>
      </div>
    </section>
  </main>
</div>

<div id="adminView" style="display:none">
  <header class="topbar">
    <div class="brand">
      <div>
        <h1>অ্যাডমিন প্যানেল</h1>
        <small id="adminUserLabel"></small>
      </div>
    </div>
    <div class="top-actions">
      <button id="backToApp">আমার খাতা</button>
      <button id="adminLogout" class="danger">লগআউট</button>
    </div>
  </header>

  <div class="admin-wrap">
    <div class="admin-header">
      <h2>পরিসংখ্যান</h2>
      <button id="refreshUsers" class="ghost">রিফ্রেশ</button>
    </div>

    <div class="stats-row">
      <div class="stat">
        <div class="stat-label">মোট ইউজার</div>
        <div class="stat-value" id="statUsers">-</div>
      </div>
      <div class="stat">
        <div class="stat-label">মোট লেখা</div>
        <div class="stat-value" id="statEntries">-</div>
      </div>
      <div class="stat">
        <div class="stat-label">কবিতা</div>
        <div class="stat-value" id="statPoems">-</div>
      </div>
      <div class="stat">
        <div class="stat-label">গল্প</div>
        <div class="stat-value" id="statStories">-</div>
      </div>
    </div>

    <h2 style="font-family:'Caveat',cursive; font-size:30px; margin:0 0 12px; color:#3b3227;">ইউজার তালিকা</h2>
    <input id="adminSearch" class="admin-search" type="text" placeholder="ইমেইল দিয়ে খুঁজো...">
    <div class="user-list" id="userList"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">লেখা</h3>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions">
      <button id="modalClose">বন্ধ করো</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signOut,
  signInWithEmailAndPassword, createUserWithEmailAndPassword,
  GoogleAuthProvider, signInWithPopup, updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {

const fmtDate = ts => {
  if (!ts) return '';
  try {
    return new Date(ts).toLocaleDateString('bn-BD',
      { day:'numeric', month:'long', year:'numeric' });
  } catch (e) { return new Date(ts).toLocaleDateString(); }
};

const fmtDateTime = ts => {
  if (!ts) return '';
  try {
    return new Date(ts).toLocaleString('bn-BD',
      { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  } catch (e) { return new Date(ts).toLocaleString(); }
};

$('#tabLogin').addEventListener('click', () => setAuthMode('login'));
$('#tabSignup').addEventListener('click', () => setAuthMode('signup'));

function setAuthMode(mode) {
  authMode = mode;
  const isLogin = mode === 'login';
  $('#tabLogin').classList.toggle('active', isLogin);
  $('#tabSignup').classList.toggle('active', !isLogin);
  $('#confirmWrap').style.display = isLogin ? 'none' : 'block';
  $('#submitBtn').textContent = isLogin ? 'লগইন করো' : 'অ্যাকাউন্ট খোলো';
  $('#password').setAttribute('autocomplete', isLogin ? 'current-password' : 'new-password');
  setAuthMsg('');
}

function setAuthMsg(msg, ok) {
  const el = $('#authMsg');
  el.textContent = msg;
  el.classList.toggle('ok', !!ok);
}

  setAuthMsg('Google খোলা হচ্ছে...');

    const provider = new GoogleAuthProvider();
    await signInWithPopup(auth, provider);

      setAuthMsg('ডোমেইন অনুমোদিত নয়। Firebase Console এ যোগ করো।');
    } else if (e.code === 'auth/operation-not-allowed') {
      setAuthMsg('Google login চালু করা হয়নি।');
    } else {
      setAuthMsg('সমস্যা: ' + e.message);
    }
  }
});

async function submitAuth() {
  const email = $('#email').value.trim();
  const pass  = $('#password').value;

  if (!email || !pass) { setAuthMsg('ইমেইল ও পাসওয়ার্ড দুটোই দাও।'); return; }
  if (pass.length < 6) { setAuthMsg('পাসওয়ার্ড কমপক্ষে ৬ অক্ষর।'); return; }

  if (authMode === 'signup') {
    const pass2 = $('#password2').value;
    if (pass !== pass2) { setAuthMsg('দুইবার লেখা পাসওয়ার্ড মিলছে না।'); return; }
  }

  setAuthMsg(authMode === 'login' ? 'লগইন হচ্ছে...' : 'অ্যাকাউন্ট তৈরি হচ্ছে...');

  try {
    if (authMode === 'login') {
      await signInWithEmailAndPassword(auth, email, pass);
    } else {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      const name = email.split('@')[0];
      await updateProfile(cred.user, { displayName: name });
    }
  } catch (e) {
    console.error(e);
    const map = {
      'auth/invalid-email': 'ইমেইলটা ঠিক নেই।',
      'auth/user-not-found': 'এই ইমেইলে অ্যাকাউন্ট নেই। আগে অ্যাকাউন্ট খোলো।',
      'auth/wrong-password': 'পাসওয়ার্ড ভুল।',
      'auth/invalid-credential': 'ইমেইল বা পাসওয়ার্ড ভুল।',
      'auth/email-already-in-use': 'এই ইমেইলে অ্যাকাউন্ট আছে। লগইন করো।',
      'auth/weak-password': 'পাসওয়ার্ড দুর্বল।',
      'auth/too-many-requests': 'অনেকবার চেষ্টা। কিছুক্ষণ পরে আবার।',
      'auth/network-request-failed': 'নেটওয়ার্ক সমস্যা।',
      'auth/operation-not-allowed': 'Firebase এ Email/Password চালু করো।'
    };
    setAuthMsg(map[e.code] || ('সমস্যা: ' + e.message));
  }
}

$('#logoutBtn').addEventListener('click', doLogout);
$('#adminLogout').addEventListener('click', doLogout);

async function doLogout() {
  if (!confirm('লগআউট করলে পরের বার আবার লগইন করলেই সব লেখা ফিরে পাবে। ঠিক আছে?')) return;
  if (unsub) { unsub(); unsub = null; }
  await signOut(auth);
}

onAuthStateChanged(auth, async user => {
  if (!user) {
    uid = null; currentUser = null; isAdmin = false;
    if (unsub) { unsub(); unsub = null; }
    showView('auth');
    setAuthMsg('');
    return;
  }

  uid = user.uid;
  currentUser = user;
  isAdmin = ADMIN_EMAILS.map(e => e.toLowerCase()).includes((user.email || '').toLowerCase());

  try {
    const userRef = doc(db, 'users', user.uid);
    const snap = await getDoc(userRef);
    if (!snap.exists()) {
      await setDoc(userRef, {
        uid: user.uid,
        email: user.email,
        displayName: user.displayName || user.email.split('@')[0],
        createdAt: Date.now(),
        lastLogin: Date.now(),
        disabled: false
      });
    } else {
      if (snap.data().disabled === true) {
        alert('আপনার অ্যাকাউন্ট অ্যাডমিন কর্তৃক নিষ্ক্রিয় করা হয়েছে।');
        await signOut(auth);
        return;
      }
      await updateDoc(userRef, { lastLogin: Date.now() });
    }
  } catch (e) {
    console.error('user doc:', e);
  }

  $('#userLabel').textContent = (user.displayName || user.email) + (isAdmin ? ' - অ্যাডমিন' : '');
  $('#adminUserLabel').textContent = user.email;
  $('#adminBtn').style.display = isAdmin ? 'inline-block' : 'none';

  showView('app');
  subscribeEntries();
  newEntry();
});

function showView(which) {
  $('#authScreen').style.display = which === 'auth' ? 'flex' : 'none';
  $('#appView').style.display    = which === 'app'   ? 'block' : 'none';
  $('#adminView').style.display  = which === 'admin' ? 'block' : 'none';
}

$('#adminBtn').addEventListener('click', () => {
  showView('admin');
  loadAdminData();
});
$('#backToApp').addEventListener('click', () => showView('app'));

function subscribeEntries() {
  if (unsub) unsub();
  const q = query(
    collection(db, 'users', uid, 'entries'),
    orderBy('updatedAt', 'desc')
  );
  unsub = onSnapshot(q, snap => {
    entries = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    renderList();
  }, err => {
    console.error(err);
    setStatus('লোড হয়নি: ' + err.message);
  });
}

function renderList() {
  const term = ($('#search').value || '').trim().toLowerCase();
  const list = entries.filter(e =>
    !term ||
    (e.title || '').toLowerCase().includes(term) ||
    (e.body  || '').toLowerCase().includes(term)
  );

  const box = $('#list');
  if (!list.length) {
    box.innerHTML = '<p class="empty">' + (term ? 'কিছু পাওয়া গেল না।' : 'এখনো কোনো পাতা নেই। লেখা শুরু করো।') + '</p>';
    return;
  }

  box.innerHTML = list.map(e =>
    '<div class="card ' + (e.id === currentId ? 'active' : '') + '" data-id="' + e.id + '">' +
      '<div class="card-top">' +
        '<span class="badge ' + (e.type === 'গল্প' ? 'story' : '') + '">' + esc(e.type || 'কবিতা') + '</span>' +
        '<span class="card-date">' + fmtDate(e.updatedAt || e.createdAt) + '</span>' +
      '</div>' +
      '<div class="card-title">' + esc(e.title || 'শিরোনামহীন') + '</div>' +
      '<div class="card-prev">' + (esc((e.body || '').replace(/\s+/g, ' ').slice(0, 55)) || '...') + '</div>' +
    '</div>'
  ).join('');
}

$('#list').addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (card) openEntry(card.dataset.id);
});
$('#search').addEventListener('input', renderList);

async function openEntry(id) {
  if (id === currentId) return;
  if (isDirty) await save();
  const en = entries.find(x => x.id === id);
  if (!en) return;

  currentId = id;
  currentType = en.type || 'কবিতা';
  $('#title').value = en.title || '';
  $('#body').value  = en.body  || '';
  $('#dateLabel').textContent = fmtDate(en.createdAt);
  $('#deleteBtn').disabled = false;
  isDirty = false;
  setTypeUI();
  updateCount();
  renderList();
  setStatus('সংরক্ষিত');
}

function newEntry() {
  currentId = null;
  currentType = 'কবিতা';
  $('#title').value = '';
  $('#body').value  = '';
  $('#dateLabel').textContent = fmtDate(Date.now());
  $('#deleteBtn').disabled = true;
  isDirty = false;
  setTypeUI();
  updateCount();
  renderList();
  setStatus('নতুন পাতা');
  $('#title').focus();
}

async function save() {
  const title = $('#title').value.trim();
  const body  = $('#body').value;
  if (!title && !body.trim()) return;

  setStatus('সংরক্ষণ হচ্ছে...');
  try {
    const now = Date.now();
    if (currentId) {
      await updateDoc(doc(db, 'users', uid, 'entries', currentId),
        { title: title, body: body, type: currentType, updatedAt: now });
    } else {
      const ref = await addDoc(collection(db, 'users', uid, 'entries'),
        { title: title, body: body, type: currentType, createdAt: now, updatedAt: now });
      currentId = ref.id;
      $('#deleteBtn').disabled = false;
      renderList();
    }
    isDirty = false;
    setStatus('সংরক্ষিত');
  } catch (err) {
    console.error(err);
    setStatus('সমস্যা: ' + err.message);
  }
}

function queueSave() {
  isDirty = true;
  setStatus('অসংরক্ষিত...');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 1400);
}

$('#saveBtn').addEventListener('click', () => { clearTimeout(saveTimer); save(); });
$('#newBtn').addEventListener('click', async () => {
  if (isDirty) await save();
  newEntry();
});
$('#deleteBtn').addEventListener('click', async () => {
  if (!currentId) return;
  if (!confirm('এই পাতাটি মুছে ফেলা হবে। নিশ্চিত?')) return;
  try {
    await deleteDoc(doc(db, 'users', uid, 'entries', currentId));
    newEntry();
    setStatus('মুছে ফেলা হয়েছে');
  } catch (err) {
    setStatus('মুছতে পারিনি: ' + err.message);
  }
});

$('#title').addEventListener('input', queueSave);
$('#body').addEventListener('input', () => { queueSave(); updateCount(); });

document.querySelectorAll('.type-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    currentType = btn.dataset.type;
    setTypeUI();
    if ($('#title').value || $('#body').value.trim()) queueSave();
  });
});

function setTypeUI() {
  document.querySelectorAll('.type-toggle button').forEach(b =>
    b.classList.toggle('active', b.dataset.type === currentType));
}
function setStatus(txt) { $('#status').textContent = txt; }
function updateCount() {
  const t = $('#body').value;
  const words = t.trim() ? t.trim().split(/\s+/).length : 0;
  $('#count').textContent = words + ' শব্দ - ' + t.length + ' অক্ষর';
}
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    clearTimeout(saveTimer);
    save();
  }
});

$('#refreshUsers').addEventListener('click', loadAdminData);
$('#adminSearch').addEventListener('input', () => renderUsers(lastUsers));

let lastUsers = [];
let userEntryCounts = {};

async function loadAdminData() {
  if (!isAdmin) return;
  $('#userList').innerHTML = '<p class="empty">লোড হচ্ছে...</p>';

  try {
    const usersSnap = await getDocs(collection(db, 'users'));
    lastUsers = usersSnap.docs.map(d => Object.assign({ id: d.id }, d.data()));

    let totalEntries = 0, totalPoems = 0, totalStories = 0;
    userEntryCounts = {};

    await Promise.all(lastUsers.map(async u => {
      const entriesSnap = await getDocs(collection(db, 'users', u.id, 'entries'));
      let c = 0, p = 0, s = 0;
      entriesSnap.forEach(d => {
        const t = d.data().type;
        c++;
        if (t === 'গল্প') s++; else p++;
      });
      userEntryCounts[u.id] = { total: c, poems: p, stories: s };
      totalEntries += c; totalPoems += p; totalStories += s;
    }));

    $('#statUsers').textContent   = lastUsers.length;
    $('#statEntries').textContent = totalEntries;
    $('#statPoems').textContent   = totalPoems;
    $('#statStories').textContent = totalStories;

    renderUsers(lastUsers);
  } catch (e) {
    console.error(e);
    $('#userList').innerHTML = '<p class="empty">লোড হয়নি: ' + esc(e.message) + '</p>';
  }
}

function renderUsers(users) {
  const term = ($('#adminSearch').value || '').trim().toLowerCase();
  const list = users
    .filter(u => !term || (u.email || '').toLowerCase().includes(term))
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  const box = $('#userList');
  if (!list.length) {
    box.innerHTML = '<p class="empty">' + (term ? 'কিছু পাওয়া গেল না।' : 'এখনো কোনো ইউজার নেই।') + '</p>';
    return;
  }

  box.innerHTML = list.map(u => {
    const c = userEntryCounts[u.id] || { total: 0, poems: 0, stories: 0 };
    const isSelf = u.id === uid;
    return '<div class="user-row ' + (u.disabled ? 'disabled' : '') + '" data-uid="' + u.id + '">' +
      '<div class="user-info">' +
        '<div class="user-email">' + esc(u.email || '(no email)') + (isSelf ? ' (তুমি)' : '') + (u.disabled ? ' (নিষ্ক্রিয়)' : '') + '</div>' +
        '<div class="user-meta">' +
          '<span>যোগদান: <b>' + fmtDate(u.createdAt) + '</b></span>' +
          '<span>শেষ লগইন: <b>' + fmtDateTime(u.lastLogin) + '</b></span>' +
          '<span>লেখা: <b>' + c.total + '</b> (কবিতা ' + c.poems + ', গল্প ' + c.stories + ')</span>' +
        '</div>' +
      '</div>' +
      '<div class="user-actions">' +
        '<button class="ghost view-user" data-uid="' + u.id + '">লেখা দেখো</button>' +
        (!isSelf ? '<button class="ghost toggle-disable" data-uid="' + u.id + '">' + (u.disabled ? 'সক্রিয়' : 'নিষ্ক্রিয়') + '</button>' : '') +
        (!isSelf ? '<button class="danger delete-user" data-uid="' + u.id + '">মুছে ফেলো</button>' : '') +
      '</div>' +
    '</div>' +
    '<div class="entries-panel" id="panel-' + u.id + '" style="display:none"></div>';
  }).join('');
}

$('#userList').addEventListener('click', async e => {
  const t = e.target;

  if (t.classList.contains('view-user')) {
    await showUserEntries(t.dataset.uid);
    return;
  }

  if (t.classList.contains('toggle-disable')) {
    const targetUid = t.dataset.uid;
    const u = lastUsers.find(x => x.id === targetUid);
    if (!u) return;
    const newState = !u.disabled;
    if (!confirm(newState ? 'এই ইউজারকে নিষ্ক্রিয় করবে?' : 'আবার সক্রিয় করবে?')) return;
    try {
      await updateDoc(doc(db, 'users', targetUid), { disabled: newState });
      u.disabled = newState;
      renderUsers(lastUsers);
    } catch (err) { alert('সমস্যা: ' + err.message); }
    return;
  }

  if (t.classList.contains('delete-user')) {
    const targetUid = t.dataset.uid;
    const u = lastUsers.find(x => x.id === targetUid);
    if (!u) return;
    if (!confirm('"' + u.email + '" এর অ্যাকাউন্ট এবং সব লেখা মুছে যাবে। নিশ্চিত?')) return;
    try {
      const entriesSnap = await getDocs(collection(db, 'users', targetUid, 'entries'));
      await Promise.all(entriesSnap.docs.map(d => deleteDoc(d.ref)));
      await deleteDoc(doc(db, 'users', targetUid));
      alert('মুছে ফেলা হয়েছে।');
      loadAdminData();
    } catch (err) { alert('সমস্যা: ' + err.message); }
  }
});

async function showUserEntries(targetUid) {
  const panel = document.getElementById('panel-' + targetUid);
  if (!panel) return;

  if (panel.style.display === 'block') {
    panel.style.display = 'none';
    return;
  }

  panel.style.display = 'block';
  panel.innerHTML = '<p class="empty">লোড হচ্ছে...</p>';

  try {
    const snap = await getDocs(collection(db, 'users', targetUid, 'entries'));
    const list = snap.docs.map(d => Object.assign({ id: d.id }, d.data()))
      .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

    if (!list.length) {
      panel.innerHTML = '<p class="empty">এই ইউজারের কোনো লেখা নেই।</p>';
      return;
    }

    panel.innerHTML = '<h4>লেখার তালিকা (' + list.length + ')</h4>' +
      list.map(e =>
        '<div class="entry-mini">' +
          '<div class="entry-mini-info">' +
            '<div class="entry-mini-title">' + esc(e.title || 'শিরোনামহীন') + '</div>' +
            '<div class="entry-mini-meta">' +
              '<span class="badge ' + (e.type === 'গল্প' ? 'story' : '') + '">' + esc(e.type || 'কবিতা') + '</span> ' +
              fmtDate(e.updatedAt || e.createdAt) +
            '</div>' +
          '</div>' +
          '<div style="display:flex;gap:6px;flex-shrink:0">' +
            '<button class="ghost view-entry" data-uid="' + targetUid + '" data-eid="' + e.id + '">দেখো</button>' +
            '<button class="danger del-entry" data-uid="' + targetUid + '" data-eid="' + e.id + '">মুছো</button>' +
          '</div>' +
        '</div>'
      ).join('');
  } catch (err) {
    panel.innerHTML = '<p class="empty">সমস্যা: ' + esc(err.message) + '</p>';
  }
}

document.addEventListener('click', async e => {
  const t = e.target;
  if (t.classList.contains('view-entry')) {
    const tu = t.dataset.uid;
    const eid = t.dataset.eid;
    try {
      const snap = await getDoc(doc(db, 'users', tu, 'entries', eid));
      if (!snap.exists()) { alert('পাওয়া যায়নি।'); return; }
      const data = snap.data();
      $('#modalTitle').textContent = data.title || 'শিরোনামহীন';
      $('#modalBody').textContent  = data.body || '(খালি)';
      $('#modalOverlay').classList.add('show');
    } catch (err) { alert('সমস্যা: ' + err.message); }
  }
  if (t.classList.contains('del-entry')) {
    const tu = t.dataset.uid;
    const eid = t.dataset.eid;
    if (!confirm('এই লেখাটি মুছে ফেলা হবে?')) return;
    try {
      await deleteDoc(doc(db, 'users', tu, 'entries', eid));
      const p = document.getElementById('panel-' + tu);
      if (p) { p.style.display = 'none'; await showUserEntries(tu); }
    } catch (err) { alert('সমস্যা: ' + err.message); }
  }
});

$('#modalClose').addEventListener('click', () => $('#modalOverlay').classList.remove('show'));
$('#modalOverlay').addEventListener('click', e => {
  if (e.target.id === 'modalOverlay') $('#modalOverlay').classList.remove('show');
});
</script>
